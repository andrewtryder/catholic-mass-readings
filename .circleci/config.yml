version: 2.1

parameters:
  daily_canary:
    type: boolean
    default: false

jobs:
  published-package-canary:
    docker:
      - image: cimg/node:22.23.5
    resource_class: small

    steps:
      - checkout

      - run:
          name: Install and test published package
          command: bash scripts/circleci/published-package-canary.sh

workflows:
  daily-live-canary:
    when: << pipeline.parameters.daily_canary >>
    jobs:
      - published-package-canary

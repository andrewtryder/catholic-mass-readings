name: CI & Code Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-format:
    name: Code Quality (Format, Lint, Typecheck & Coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage

  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Test
        run: npm test

  build:
    name: Build Production Bundles (JS & CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Build library and CLI
        run: npm run build

  smoke-test:
    name: Package Verification & Import Smoke Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Build
        run: npm run build
      - name: Validate package manifest (dry run)
        run: npm pack --dry-run
      - name: Pack tarball
        run: |
          npm pack --quiet
          TARBALL=$(ls -1 catholic-mass-readings-*.tgz | head -n 1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
      - name: Smoke test — tarball install, ESM import, type import, CLI --help
        run: |
          TMPDIR=$(mktemp -d)
          cp "$TARBALL" "$TMPDIR/"
          cd "$TMPDIR"

          # Bootstrap a minimal ESM project and install the tarball
          echo '{"name":"smoke","version":"1.0.0","type":"module","private":true}' > package.json
          npm install --quiet "./$TARBALL"

          # ESM import smoke test
          node --input-type=module --eval "
            import { USCCB, MassType } from 'catholic-mass-readings';
            if (typeof USCCB !== 'function') throw new Error('USCCB not exported');
            if (typeof MassType !== 'object') throw new Error('MassType not exported');
            console.log('ESM import OK');
          "

          # Type declarations smoke test (uses the project's tsc — already installed)
          printf '{\n  "compilerOptions": {\n    "module": "NodeNext",\n    "moduleResolution": "NodeNext",\n    "target": "ES2022",\n    "strict": true,\n    "noEmit": true\n  },\n  "files": ["check.ts"]\n}\n' > tsconfig.json
          printf 'import type { Mass, Reading, Verse } from "catholic-mass-readings";\nconst _m: Partial<Mass> = {};\nconst _r: Partial<Reading> = {};\nconst _v: Partial<Verse> = {};\n' > check.ts
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc"
          echo "Type import OK"

          # CLI smoke test
          ./node_modules/.bin/catholic-mass-readings --help
          echo "CLI --help OK"

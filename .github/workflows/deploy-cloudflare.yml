name: Deploy to Cloudflare Workers

# Manual until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are configured.
# To deploy on every push to main, add:
#   push:
#     branches: [main]
#     paths: [src/**, worker/**, wrangler.jsonc, package.json, package-lock.json, tsconfig*.json]
on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

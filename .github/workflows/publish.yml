name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm >= 11.5.1 required for OIDC trusted publishing
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # If ENEEDAUTH occurs, setup-node may have written an empty _authToken line;
      # strip it so npm falls back to OIDC token exchange.
      - name: Publish to npm
        run: |
          if grep -q '_authToken=\${NODE_AUTH_TOKEN}' ~/.npmrc 2>/dev/null; then
            sed -i.bak '/_authToken=\${NODE_AUTH_TOKEN}/d' ~/.npmrc
          fi
          npm publish --provenance

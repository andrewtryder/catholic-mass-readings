name: Release & Publish Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create Release PR & GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # GITHUB_TOKEN PRs are opened as github-actions[bot] and require manual
          # workflow approval before CI runs. Use a PAT so PRs are yours instead.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish Package to npmjs (OIDC Trusted Publisher)
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm >= 11.5.1 required for OIDC trusted publishing; pin to a reviewed version.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: |
          if grep -q '_authToken=\${NODE_AUTH_TOKEN}' ~/.npmrc 2>/dev/null; then
            sed -i.bak '/_authToken=\${NODE_AUTH_TOKEN}/d' ~/.npmrc
          fi
          npm publish --provenance

  deploy-docs:
    name: Deploy API Docs to GitHub Pages
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/reusable-docs-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
